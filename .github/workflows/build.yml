name: Build Android APK

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:
    inputs:
      zip_path:
        description: "Ruta de un zip chess*.zip dentro del repo (vacío = buscar automáticamente)"
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Descomprimir zip chess*.zip
        env:
          ZIP_INPUT: ${{ github.event.inputs.zip_path }}
        shell: bash
        run: |
          set -euo pipefail

          # 1. Elegir el zip: el indicado manualmente o el primero chess*.zip del repo
          if [ -n "${ZIP_INPUT:-}" ]; then
            ZIP="$ZIP_INPUT"
          else
            ZIP=$(find . -type f -name 'chess*.zip' -not -path './.git/*' -print -quit)
          fi

          if [ -z "${ZIP:-}" ] || [ ! -f "$ZIP" ]; then
            echo "No se encontró ningún zip cuyo nombre empiece por 'chess' en el repositorio"
            exit 1
          fi

          # 2. Validar el nombre: solo se aceptan archivos que empiecen por 'chess'
          NAME=$(basename "$ZIP")
          case "$NAME" in
            chess*.zip) ;;
            *) echo "Zip rechazado: '$NAME' no empieza por 'chess'"; exit 1 ;;
          esac
          echo "Usando zip: $ZIP"

          # 3. Descomprimir
          rm -rf build_src
          mkdir build_src
          unzip -q "$ZIP" -d build_src

          # 4. Localizar el proyecto Gradle dentro del zip
          SETTINGS=$(find build_src -name settings.gradle.kts -print -quit)
          if [ -z "$SETTINGS" ]; then
            echo "El zip no contiene settings.gradle.kts"
            exit 1
          fi
          PROJECT_DIR=$(dirname "$SETTINGS")
          echo "Proyecto Gradle en: $PROJECT_DIR"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Compilar APK debug
        working-directory: ${{ env.PROJECT_DIR }}
        run: gradle :app:assembleDebug --no-daemon

      - name: Subir APK como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: chess-vision-overlay-debug-apk
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
